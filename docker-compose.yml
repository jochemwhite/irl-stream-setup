version: '3.9'

services:
  api:
    build:
      context: apps/api
    image: xpudu-api:latest
    container_name: xpudu-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - apps/api/.env
    environment:
      - NODE_ENV=production
      - PORT=8000
    networks:
      - monitoring-net
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  web:
    build:
      context: apps/web
      args:
        BACKEND_URL: http://api:8000
    image: xpudu-web:latest
    container_name: xpudu-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - BACKEND_URL=http://api:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws
    depends_on:
      api:
        condition: service_healthy
    networks:
      - monitoring-net
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  monitoring-net:
    driver: bridge
