version: '3.9'

services:
  api:
    build:
      context: apps/api
    image: xpudu-api:latest
    container_name: xpudu-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=8000
    networks:
      - monitoring-net
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.xpudu-api.rule=Host(`api.xpudu.com`)"
      - "traefik.http.routers.xpudu-api.entrypoints=https"
      - "traefik.http.routers.xpudu-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.xpudu-api-svc.loadbalancer.server.port=8000"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  mediamtx:
    image: bluenviron/mediamtx:1.17.1
    container_name: mediamtx
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8554:8554"
      - "1935:1935"
      - "8888:8888"
      - "8889:8889"
      - "8890:8890/udp"
      - "8189:8189/udp"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    networks:
      - monitoring-net

  web:
    build:
      context: apps/web
      args:
        BACKEND_URL: http://api:8000
        NEXT_PUBLIC_WS_URL: wss://api.xpudu.com/ws
    image: xpudu-web:latest
    container_name: xpudu-web
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - BACKEND_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - monitoring-net
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.xpudu-web.rule=Host(`dashboard.xpudu.com`)"
      - "traefik.http.routers.xpudu-web.entrypoints=https"
      - "traefik.http.routers.xpudu-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.xpudu-web-svc.loadbalancer.server.port=3000"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  monitoring-net:
    driver: bridge
  traefik:
    external: true
