root@docker:/opt/docker/compose/xpudu/irl-stream-setup# cat mediamtx.yml
###############################################
# MediaMTX v1.17.1 — IRL Streaming Setup
# IRL Pro (SRT) → MediaMTX → OBS (RTMP pull)
###############################################

logLevel: info
readTimeout: 20s
writeTimeout: 20s
udpMaxPayloadSize: 1316
udpReadBufferSize: 8388608

###############################################
# Metrics & Authentication
###############################################
metrics: yes
metricsAddress: :9998
authMethod: internal
authInternalUsers:
  - user: any
    pass: ""
    ips: []
    permissions:
      - action: publish
      - action: read
      - action: playback
  - user: any
    pass: ""
    ips: ['127.0.0.1', '::1']
    permissions:
      - action: api
      - action: metrics
      - action: pprof
  - user: any
    pass: ""
    ips: ['10.10.10.0/24', '172.16.0.0/12']
    permissions:
      - action: metrics

###############################################
# Protocols
###############################################
rtsp: true
rtmp: true
hls: true
webrtc: true
webrtcLocalUDPAddress: :8189
webrtcAdditionalHosts: [10.10.10.237]

###############################################
# SRT
###############################################
srt: true
srtAddress: :8890

###############################################
# Path defaults
###############################################
pathDefaults:
  useAbsoluteTimestamp: no
  alwaysAvailable: no

###############################################
# Paths
###############################################
paths:
  xpudu:
    srtPublishPassphrase: GtMUJ^0SedvMO9iS^pdJ5fA*#DAdJfnu!3Y$LEVoN&HMMaJmO6_
    record: no

    # Keep the path always available with a black frame + silence
    # when no SRT publisher is connected. OBS never drops the RTMP
    # connection so no crackling when the phone reconnects.
    alwaysAvailable: yes
    alwaysAvailableTracks:
      - codec: H264
      - codec: MPEG4Audio
        sampleRate: 48000
        channelCount: 2