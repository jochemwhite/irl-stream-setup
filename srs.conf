# SRS v6 configuration for xpudu-monitoring
# Replace MONITORING_SERVER_IP with the IP/hostname running this service.

listen              1935;
max_connections     1000;
srs_log_tank        file;
srs_log_file        ./objs/srs.log;
daemon              on;
pid                 ./objs/srs.pid;

http_api {
    enabled         on;
    listen          1985;
    crossdomain     on;
}

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

stats {
    network         0;
    disk            sda sdb xvda xvdb;
}

vhost __defaultVhost__ {
    http_hooks {
        enabled         on;
        on_publish      http://MONITORING_SERVER_IP:3000/hooks/on_publish;
        on_unpublish    http://MONITORING_SERVER_IP:3000/hooks/on_unpublish;
        on_play         http://MONITORING_SERVER_IP:3000/hooks/on_play;
        on_stop         http://MONITORING_SERVER_IP:3000/hooks/on_stop;
    }
}
